      - name: Copy Komata project into repository
        shell: bash
        run: |
          rsync -a --exclude='.github/' /tmp/komata-import/Komata-M1/ ./

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Komata project is already imported."
            exit 0
          fi
          git commit -m "Import Komata M1"
          git push
