name: Komata Build Diagnose

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build Komata and capture full log
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee komata-build-full.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate Komata build diagnose
        if: always()
        shell: bash
        run: |
          BUILD_EXIT="${{ steps.build.outputs.exit_code }}"
          FULL_LOG="komata-build-full.log"
          DIAG="KOMATA-BUILD-DIAGNOSE.txt"

          if [ ! -f "$FULL_LOG" ]; then
            echo "No Gradle log was produced." > "$FULL_LOG"
          fi

          if [ "$BUILD_EXIT" = "0" ]; then
            RESULT="SUCCESS"
          else
            RESULT="FAILED"
          fi

          {
            echo "KOMATA BUILD DIAGNOSE"
            echo "====================="
            echo
            echo "RESULT: $RESULT"
            echo "BUILD EXIT CODE: ${BUILD_EXIT:-unknown}"
            echo

            if grep -qE '^e: |error:|FAILURE: Build failed|Execution failed for task|Could not resolve|Could not find|Unresolved reference|Cannot infer|Type mismatch|Compilation error|Manifest merger failed|AAPT: error|Duplicate class|Could not determine the dependencies' "$FULL_LOG"; then
              echo "PRIMARY ERROR CANDIDATES"
              echo "------------------------"
              grep -nE '^e: |error:|FAILURE: Build failed|Execution failed for task|Could not resolve|Could not find|Unresolved reference|Cannot infer|Type mismatch|Compilation error|Manifest merger failed|AAPT: error|Duplicate class|Could not determine the dependencies' "$FULL_LOG" \
                | head -n 40
            else
              echo "PRIMARY ERROR CANDIDATES"
              echo "------------------------"
              echo "No standard Android or Kotlin error pattern was detected."
            fi

            echo
            echo "FAILED TASKS"
            echo "------------"
            grep -nE '^> Task .* FAILED|Execution failed for task' "$FULL_LOG" \
              | head -n 25 || true

            echo
            echo "KOTLIN AND JAVA ERRORS"
            echo "----------------------"
            grep -nE '^e: |\.kt:[0-9]+:[0-9]+|\.java:[0-9]+:|Unresolved reference|Cannot infer|Type mismatch|Compilation error' "$FULL_LOG" \
              | head -n 40 || true

            echo
            echo "GRADLE AND DEPENDENCY ERRORS"
            echo "----------------------------"
            grep -nE 'Could not resolve|Could not find|Could not determine|Plugin .* was not found|No matching variant|requires at least|Minimum supported Gradle|Unsupported class file|dependency|repository' "$FULL_LOG" \
              | head -n 40 || true

            echo
            echo "ANDROID RESOURCE OR MANIFEST ERRORS"
            echo "-----------------------------------"
            grep -nE 'AAPT: error|Android resource linking failed|Manifest merger failed|resource .* not found|uses-sdk|minSdk|Duplicate class' "$FULL_LOG" \
              | head -n 40 || true

            echo
            echo "LAST 80 LOG LINES"
            echo "-----------------"
            tail -n 80 "$FULL_LOG"
          } > "$DIAG"

          cat "$DIAG"

      - name: Publish diagnose in Actions Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Komata Build Diagnose"
            echo
            echo '```text'
            sed -n '1,220p' KOMATA-BUILD-DIAGNOSE.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnose and full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Komata-build-diagnose
          path: |
            KOMATA-BUILD-DIAGNOSE.txt
            komata-build-full.log
          retention-days: 14

      - name: Upload debug APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Komata-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Mark workflow failed when build failed
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Komata build failed. See KOMATA-BUILD-DIAGNOSE.txt."
          exit 1
